ov 22:40, no diagnosis, disposition unknown). 7 outreach attempts to (555) 010-0103: 6 voicemails, 1 wrong person, 0 member connections. The person who answered on 2 Nov said she is a former partner. Asthma on FQHC problem list, no controller fill in the dataset. No PCP assigned. No alternative contact is on record.",what_should_the_case_manager_see_and_do_at_8am_Monday:"See: frequent ED use with failed outreach and an unsafe phone number. Do: stop calling (555) 010-0103; ask Riverside Community Clinic (FQHC, seen 2 Oct) to help verify a safe way to reach him; no alternative number exists in the data, so do not guess one; flag the missing PCP assignment.",plan:"MMC-Standard",dataset_categories_with_records:7,datasets_present:"Member_Eligibility, ADT_Alerts, Claims, Pharmacy_Fills, Clinical_HIE, Contact_History, SDOH_HRA"},{member_id:"M-70104",name:"Danielle Moore",age:45,sex:"F",line_of_business:"Medicaid managed care",language:"English",scenario:"Behavioral health plus housing instability",key_facts_at_8am:"Inpatient psychiatric discharge Thu 5 Nov. ADT disposition says home, the 30 Oct screen says shelter on discharge. Psychiatry follow-up due by Thu 12 Nov, none booked. Discharge list: quetiapine started, lurasidone stopped; pharmacy history shows lurasidone active; no dispensing event recorded for quetiapine. Prepaid phone not in service.",what_should_the_case_manager_see_and_do_at_8am_Monday:"See: behavioral-health discharge with a housing conflict, a medication reconciliation need and a follow-up deadline in 3 days. Do: confirm where Danielle can safely be reached before disclosing health details (shelter contact route); reconcile quetiapine versus lurasidone with the prescriber; book psychiatry follow-up by 12 Nov.",plan:"MMC-Standard",dataset_categories_with_records:8,datasets_present:"Member_Eligibility, ADT_Alerts, Claims, Pharmacy_Fills, Clinical_HIE, Labs, Contact_History, SDOH_HRA"},{member_id:"M-70105",name:"Mei-Ling Chen",age:81,sex:"F",line_of_busine
